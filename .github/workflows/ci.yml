name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY_NAMESPACE: juanroldan1989

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      # Output is a JSON list of the services whose folder (or this workflow) changed.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            name:
              - '.github/workflows/ci.yml'
              - 'services/name/**'
            greeting:
              - '.github/workflows/ci.yml'
              - 'services/greeting/**'
            farewell:
              - '.github/workflows/ci.yml'
              - 'services/farewell/**'
            fareweller:
              - '.github/workflows/ci.yml'
              - 'services/fareweller/**'
            greeter:
              - '.github/workflows/ci.yml'
              - 'services/greeter/**'
            greeter-saver:
              - '.github/workflows/ci.yml'
              - 'services/greeter-saver/**'
            friends:
              - '.github/workflows/ci.yml'
              - 'services/friends/**'
            sqs-processor:
              - '.github/workflows/ci.yml'
              - 'services/sqs-processor/**'

  test:
    name: Test (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest

  build:
    name: Build (${{ matrix.service }})
    needs: [changes, test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}

  publish:
    name: Publish (${{ matrix.service }})
    needs: [changes, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Docker Hub secrets live in this environment, which is restricted to the main branch.
    environment: dockerhub
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.service }}
          tags: type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
